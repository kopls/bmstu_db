services:
  grafana:
    image: grafana/grafana:12.3.1
    container_name: bmstu_db_lab10_grafana
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_USER: artyom
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-warehouse12345}
      GF_USERS_ALLOW_SIGN_UP: "false"
      PGHOST: ${PGHOST:-localhost}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-warehouse}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana12345}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
volumes:
  grafana_data:
