apiVersion: 1

datasources:
  - name: warehouse
    uid: warehouse-postgres
    type: postgres
    access: proxy
    url: $PGHOST:$PGPORT
    user: warehouse_grafana
    isDefault: true
    editable: false
    jsonData:
      database: $PGDATABASE
      sslmode: disable
      postgresVersion: 1400
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
