services:
  nifi:
    image: apache/nifi:2.6.0
    container_name: bmstu_db_lab08_nifi
    network_mode: host
    environment:
      NIFI_WEB_HTTPS_HOST: 127.0.0.1
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_PROXY_HOST: localhost:8443,127.0.0.1:8443
      SINGLE_USER_CREDENTIALS_USERNAME: artyom
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:-warehouse12345}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      - ./input:/data/input
      - ./loaded:/data/loaded
      - ./rejected:/data/rejected
      - ./drivers:/data/drivers:ro
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_logs:/opt/nifi/nifi-current/logs
volumes:
  nifi_conf:
  nifi_state:
  nifi_logs:
